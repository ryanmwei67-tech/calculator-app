/* Cleaned and improved style sheet for CALCX */

:root {
  --bg: #0b0f1a;
  --card: #111827;
  --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
  --accent-color: #7c3aed;
  --btn: #1f2937;
  --text: #ffffff;
  --text-secondary: #9ca3af;
  --display-bg: #020617;
  --operator-bg: #2563eb;
  --function-bg: #f59e0b;
  --equal-bg: linear-gradient(135deg, #22c55e, #4ade80);
  --border-color: rgba(255, 255, 255, 0.06);
  --focus-ring: rgba(124, 58, 237, 0.18);
  --card-shadow: 0 18px 40px rgba(2,6,23,0.6);
}

html[data-theme="light"] {
  --bg: #f3f4f6;
  --card: #ffffff;
  --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
  --accent-color: #06b6d4;
  --btn: #e5e7eb;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --display-bg: #f9fafb;
  --operator-bg: #3b82f6;
  --function-bg: #fbbf24;
  --equal-bg: linear-gradient(135deg, #34d399, #6ee7b7);
  --border-color: rgba(0, 0, 0, 0.08);
  --focus-ring: rgba(6, 182, 212, 0.14);
  --card-shadow: 0 8px 20px rgba(15,23,42,0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', Roboto, -apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
  transition: background-color 260ms ease;
  color: var(--text);
}

.app {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--card-shadow);
  transition: background-color 260ms ease, box-shadow 260ms ease, transform 160ms ease;
  isolation: isolate;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 12px;
}

.header-left h1 {
  font-size: 26px;
  line-height: 1;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}

.tagline {
  font-size: 12px;
  color: var(--text-secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-actions button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 18px;
  background: var(--btn);
  border: 1px solid transparent;
  cursor: pointer;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
}

.header-actions button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(2,6,23,0.16);
}

main {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ad-space {
  min-height: 56px;
  background: var(--btn);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 12px;
}

.calculator {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#display {
  width: 100%;
  height: 68px;
  background: var(--display-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text);
  font-size: 30px;
  font-weight: 600;
  text-align: right;
  padding: 12px 14px;
  caret-color: transparent;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  transition: background-color 200ms ease, border-color 200ms ease;
}

#display:focus {
  outline: none;
  box-shadow: 0 6px 18px var(--focus-ring);
  border-color: var(--accent-color);
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 60px;
  border: none;
  border-radius: 12px;
  background: var(--btn);
  color: var(--text);
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 120ms ease, box-shadow 120ms ease, background-color 160ms ease;
  user-select: none;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(2,6,23,0.14);
}

button:active {
  transform: translateY(0);
  box-shadow: none;
}

button.operator {
  background: var(--operator-bg);
  color: #fff;
  font-weight: 700;
}

button.function {
  background: var(--function-bg);
  color: #000;
  font-weight: 700;
}

button.equal {
  background: var(--equal-bg);
  grid-column: span 2;
  font-weight: 700;
  color: #fff;
}

button.zero {
  grid-column: span 2;
}

#scientific {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-color);
}

#scientific button {
  height: 50px;
  font-size: 14px;
  background: var(--operator-bg);
  color: #fff;
}

#scientific.hidden {
  display: none;
}

.content {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}

.content h2 {
  font-size: 15px;
  color: var(--text);
  margin-bottom: 8px;
}

.content p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.45;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
  font-size: 12px;
  gap: 12px;
}

.footer-left,
.footer-right {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.footer p {
  color: var(--text-secondary);
  margin: 0;
  font-size: 12px;
}

.footer a {
  color: var(--accent-color);
  text-decoration: none;
  transition: opacity 160ms ease, text-decoration 160ms ease;
}

.footer a:hover,
.footer a:focus {
  opacity: 0.9;
  text-decoration: underline;
}

button:focus,
a:focus {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

.privacy-page {
  display: block;
  padding: 32px 16px;
}

.privacy-shell {
  width: min(960px, 100%);
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
}

.privacy-header {
  padding: 28px 32px 20px;
  border-bottom: 1px solid var(--border-color);
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(6, 182, 212, 0.08));
}

.privacy-header .brand-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: var(--accent-gradient);
  color: white;
  font-weight: 800;
  font-size: 1.3rem;
  box-shadow: 0 10px 25px rgba(124, 58, 237, 0.28);
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.privacy-header h1 {
  font-size: clamp(2rem, 4vw, 2.8rem);
  font-weight: 800;
  line-height: 1.1;
  color: var(--text);
}

.privacy-intro {
  max-width: 720px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.privacy-content {
  padding: 28px 32px 32px;
}

.privacy-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.privacy-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 20px 20px 18px;
}

.privacy-card h2 {
  font-size: 1.06rem;
  margin-bottom: 12px;
  color: var(--text);
}

.privacy-card p {
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 10px;
}

.privacy-card p:last-child {
  margin-bottom: 0;
}

.privacy-card a {
  color: var(--accent-color);
  text-decoration: none;
}

.privacy-card a:hover,
.privacy-card a:focus {
  text-decoration: underline;
}

.full-width {
  grid-column: 1 / -1;
}

.last-updated {
  margin-top: 6px;
  font-weight: 600;
  color: var(--text);
}

@media (max-width: 640px) {
  .privacy-grid {
    grid-template-columns: 1fr;
  }

  .privacy-header,
  .privacy-content {
    padding-left: 20px;
    padding-right: 20px;
  }

  .privacy-header .brand-row {
    align-items: flex-start;
  }
}

@media (max-width: 480px) {
  .app {
    width: 100%;
    max-width: none;
    border-radius: 14px;
    padding: 14px;
  }

  .header-left h1 {
    font-size: 22px;
  }

  #display {
    height: 60px;
    font-size: 26px;
  }

  button {
    height: 54px;
    font-size: 16px;
  }

  .footer {
    flex-direction: column;
    align-items: flex-start;
  }
}


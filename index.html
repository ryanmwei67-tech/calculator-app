<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALCX - Smart Calculator</title>

<link rel="stylesheet" href="style.css">

<!-- AdSense (AFTER APPROVAL ONLY) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX"
crossorigin="anonymous"></script>

</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">
        <h1>CALCX</h1>
        <div class="header-buttons">
            <button onclick="toggleTheme()">🌙</button>
            <button onclick="toggleScientific()">🧠</button>
        </div>
    </header>

    <!-- Top Ad -->
    <div class="ad-space">
        <p>Advertisement</p>
    </div>

    <!-- Calculator -->
    <section class="calculator">

        <input type="text" id="display" disabled>

        <div class="buttons">

            <!-- Basic -->
            <button onclick="clearAll()" class="function">C</button>
            <button onclick="deleteLast()" class="function">⌫</button>
            <button onclick="append('%')" class="operator">%</button>
            <button onclick="append('/')" class="operator">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('*')" class="operator">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('-')" class="operator">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('+')" class="operator">+</button>

            <button onclick="append('0')" class="zero">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="calculate()" class="equal">=</button>

            <!-- Scientific -->
            <div id="scientific" class="hidden">
                <button onclick="append('Math.sqrt(')">√</button>
                <button onclick="append('**2')">x²</button>
                <button onclick="append('Math.sin(')">sin</button>
                <button onclick="append('Math.cos(')">cos</button>
                <button onclick="append('Math.tan(')">tan</button>
                <button onclick="append('Math.log10(')">log</button>
                <button onclick="append('Math.PI')">π</button>
                <button onclick="append('Math.E')">e</button>
            </div>

        </div>

    </section>

    <!-- Content -->
    <section class="content">
        <h2>About CALCX</h2>
        <p>Free smart calculator for students and professionals.</p>
    </section>

    <!-- Bottom Ad -->
    <div class="ad-space">
        <p>Advertisement</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 CALCX</p>
        <p>Email: ryanmwei67@gmail.com</p>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

</div>

<audio id="clickSound" src="click.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
